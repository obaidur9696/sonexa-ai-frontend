<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sonexa AI is an interactive voice conversation platform where you can practice speaking with AI on any topic, in any language, and build communication confidence." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sonexaai.tech/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sonexa AI" />
    <meta property="og:url" content="https://sonexaai.tech/" />
    <meta property="og:title" content="Sonexa AI | Practice Conversations with AI in Any Language" />
    <meta property="og:description" content="Practice natural voice conversations with AI on any topic, in any language, and build communication confidence." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Sonexa AI | Practice Conversations with AI in Any Language" />
    <meta name="twitter:description" content="Practice natural voice conversations with AI on any topic, in any language, and build communication confidence." />
    <meta name="theme-color" content="#4f46e5" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
          const root = document.documentElement;
          const isDark = theme === 'dark';
          root.classList.toggle('dark', isDark);
          root.style.colorScheme = theme;
          root.style.backgroundColor = isDark ? '#09090b' : '#ffffff';
          document.querySelector('meta[name="theme-color"]')?.setAttribute(
            'content',
            isDark ? '#09090b' : '#4f46e5'
          );
        } catch {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
          document.documentElement.style.backgroundColor = '#ffffff';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sonexa AI | Practice Conversations with AI in Any Language</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
